spring:
  application:
    name: cookbook
  config:
    import: "optional:classpath:application-secret.properties"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
  liquibase:
    change-log: db/changelog/changelog-master.xml

logging:
  level:
    root: info
    org.springframework: warn
    org.hibernate: error
  pattern:
    console: "%d{HH:mm:ss.SSS} [%8.8thread] %highlight(%-5.5level)| %class{60}.%M:%L %msg%n"

jwt:
  secret: ${jwt.secret}
  lifetime: ${jwt.lifetime}